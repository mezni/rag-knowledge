[project]
name = "rag-knowledge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pymupdf>=2.1",
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
    "ruff>=0.17.6",
]

[project.scripts]
rag-knowledge = "rag_knowledge:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
